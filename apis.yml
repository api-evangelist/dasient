name: Dasient
description: 'Dasient was a web anti-malware company founded in 2008 in Sunnyvale, California by
  ex-Google engineers Neil Daswani and Shariq Rizvi with McKinsey consultant Ameet Ranadive. It sold
  cloud-based protection against web-based malware and malvertising, scanning customer websites and ad
  networks with its Malware Analysis Platform. It shipped a JSON-RPC over HTTP "Web Protection API" that
  let customers schedule and run on-demand malware scans of individual domains and URLs, with tiered
  pricing by scans per day. Twitter acquired Dasient in January 2012 for a reported $19.1 million; the
  product was retired, dasient.com went dark in late 2012, and the domain is now a parked defensive
  registration held by Twitter. This company is DEFUNCT and has no live API surface to enrich.'
